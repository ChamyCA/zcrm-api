[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zcrm-api"
version = "1.0.0"
description = "Credential-safe Zoho CRM API access for Claude Code (demo orgs only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests", "keyring", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "requests-mock", "ruff"]

[project.scripts]
zcrm = "zcrm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zcrm"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "profiles.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
